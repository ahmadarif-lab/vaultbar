name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Unit tests
        # The Vaultwarden end-to-end tests skip themselves unless VW_URL is set.
        run: swift test
