name: Release

# Push a tag such as v0.2.0 (after bumping CFBundleShortVersionString in Resources/Info.plist and adding a
# "## 0.2.0" section to CHANGELOG.md) and this builds the universal app, the DMG and the PKG, and publishes them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version" >&2
            exit 1
          fi
          grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version' section" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unit tests
        run: swift test

      - name: Build the app, DMG and PKG
        run: ./Scripts/package_release.sh

      - name: Release notes
        run: |
          {
            awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
            echo
            echo '**Install**'
            echo
            echo '```sh'
            echo 'brew install --cask ahmadarif-lab/tap/vaultbar'
            echo '```'
            echo
            echo 'or download **`VaultBar.pkg`** (double-click installer) or **`VaultBar.dmg`** (drag to Applications). The app is ad-hoc signed and the installer is unsigned, so macOS warns the first time: right-click the file and choose **Open**.'
          } > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/VaultBar.pkg dist/VaultBar.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/VaultBar.pkg dist/VaultBar.dmg \
              --title "VaultBar $VERSION" --notes-file notes.md
          fi

      - name: Checksums for the Homebrew cask
        run: |
          {
            echo '### Checksums'
            echo '```'
            shasum -a 256 dist/VaultBar.dmg dist/VaultBar.pkg
            echo '```'
            echo 'Put the **DMG** sha256 in `Casks/vaultbar.rb` of the tap.'
          } >> "$GITHUB_STEP_SUMMARY"
